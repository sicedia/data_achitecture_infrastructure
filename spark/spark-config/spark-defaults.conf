# Spark Configuration for Iceberg and S3 Integration

# Iceberg Configuration
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg_dev           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_dev.type      nessie
spark.sql.catalog.iceberg_dev.uri       http://nessie:19120/api/v2
spark.sql.catalog.iceberg_dev.ref       main
spark.sql.catalog.iceberg_dev.warehouse s3a://cedia-datalake-dev/iceberg
spark.sql.catalog.iceberg_dev.io-impl   org.apache.iceberg.aws.s3.S3FileIO

# S3/MinIO Configuration
spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.access.key          AKIAIOSFODNN7EXAMPLE
spark.hadoop.fs.s3a.secret.key          wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
spark.hadoop.fs.s3a.path.style.access   true
spark.hadoop.fs.s3a.impl                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Performance and Memory Configuration
spark.serializer                        org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled true
spark.dynamicAllocation.enabled         false

# JAR Dependencies for Iceberg and S3
spark.jars.packages                     org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.3,org.apache.hadoop:hadoop-aws:3.3.4,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.73.0

# Logging
spark.eventLog.enabled                  true
spark.eventLog.dir                      /tmp/spark-events
spark.history.fs.logDirectory           /tmp/spark-events

# Network and Security
spark.network.timeout                   300s
spark.sql.execution.arrow.pyspark.enabled true


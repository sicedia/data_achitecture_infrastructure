version: 2

sources:
  - name: sia_bronze
    description: "Bronze layer data from Airbyte ingestion from MariaDB"
    database: "{{ target.database }}"   # iceberg_dev
    schema: cedia_bronze_sia
    # Configuración para OpenMetadata lineage
    meta:
      owner: "data-team"
      source_system: "mariadb"
      ingestion_tool: "airbyte"
      data_layer: "bronze"
    tables:
      - name: jvc_proforma
        description: "Raw proforma data from MariaDB via Airbyte"
        # Configuración para lineage
        meta:
          source_table: "jvc_proforma"
          source_database: "mariadb"
          ingestion_frequency: "daily"
        columns:
          - name: id
            description: "Primary key identifier"
            tests:
              - unique
              - not_null
          - name: created_at
            description: "Record creation timestamp"
          - name: updated_at
            description: "Record last update timestamp"
